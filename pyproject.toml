[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiceharness"
version = "0.1.0"
description = "Provider-neutral analog circuit design agents, SPICE verification, and MCP tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.11,<3",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=2.3,<3",
  "openai>=2,<3",
  "anthropic>=0.80,<1",
  "pypdf>=6,<7",
  "py7zr>=1,<2",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10,<4",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[project.scripts]
spiceharness = "spiceharness.cli:app"
spice = "spiceharness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spiceharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py313"
